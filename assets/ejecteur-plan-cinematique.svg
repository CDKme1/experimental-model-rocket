<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1800" viewBox="0 0 3000 1800">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b28"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .title{font:700 54px system-ui,-apple-system,sans-serif;fill:#f4f7fb;letter-spacing:1px}
      .subtitle{font:400 27px system-ui,-apple-system,sans-serif;fill:#91a4ba}
      .legend-title{font:700 29px system-ui,-apple-system,sans-serif;fill:#f4f7fb}
      .legend{font:500 25px system-ui,-apple-system,sans-serif;fill:#cfdae6}
      .small{font:400 21px system-ui,-apple-system,sans-serif;fill:#8193a8}
      .num{font:700 24px system-ui,-apple-system,sans-serif;fill:#081018;text-anchor:middle;dominant-baseline:central}
      .callout{fill:none;stroke:#5eead4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#5eead4;stroke:#071018;stroke-width:5}
    </style>
  </defs>

  <rect width="3000" height="1800" fill="#080d14"/>
  <rect x="34" y="34" width="2932" height="1732" rx="34" fill="url(#panel)" stroke="#26364a" stroke-width="3"/>

  <text x="90" y="112" class="title">ÉJECTEUR DE COIFFE — SCHÉMA CINÉMATIQUE</text>
  <text x="92" y="158" class="subtitle">Vue orthogonale • transmission symétrique par pignons et crémaillères</text>

  <rect x="72" y="202" width="2280" height="1520" rx="24" fill="#2d3441" stroke="#26364a" stroke-width="3" filter="url(#shadow)"/>
  <image href="ejecteur-dessus.png" x="72" y="202" width="2280" height="1520" preserveAspectRatio="xMidYMid meet"/>

  <!-- Callouts -->
  <path class="callout" d="M1180 340 L1180 236 L2400 236"/>
  <circle class="dot" cx="1180" cy="340" r="22"/><text class="num" x="1180" y="340">1</text>

  <path class="callout" d="M920 580 L2180 580 L2400 515"/>
  <circle class="dot" cx="920" cy="580" r="22"/><text class="num" x="920" y="580">2</text>

  <path class="callout" d="M688 780 L2210 780 L2400 790"/>
  <circle class="dot" cx="688" cy="780" r="22"/><text class="num" x="688" y="780">3</text>

  <path class="callout" d="M1138 1100 L2200 1100 L2400 1065"/>
  <circle class="dot" cx="1138" cy="1100" r="22"/><text class="num" x="1138" y="1100">4</text>

  <path class="callout" d="M430 1410 L2180 1410 L2400 1340"/>
  <circle class="dot" cx="430" cy="1410" r="22"/><text class="num" x="430" y="1410">5</text>

  <!-- Legend -->
  <text x="2425" y="300" class="legend-title">REPÈRES</text>

  <circle cx="2448" cy="390" r="20" fill="#5eead4"/><text x="2448" y="390" class="num">1</text>
  <text x="2490" y="383" class="legend">Support supérieur du ressort</text>
  <text x="2490" y="419" class="small">Retenu puis libéré par les verrous</text>

  <circle cx="2448" cy="600" r="20" fill="#5eead4"/><text x="2448" y="600" class="num">2</text>
  <text x="2490" y="593" class="legend">Crémaillères de verrouillage</text>
  <text x="2490" y="629" class="small">Rétraction symétrique avant éjection</text>

  <circle cx="2448" cy="810" r="20" fill="#5eead4"/><text x="2448" y="810" class="num">3</text>
  <text x="2490" y="803" class="legend">Crémaillères de transmission</text>
  <text x="2490" y="839" class="small">Commandent les verrous supérieurs</text>

  <circle cx="2448" cy="1020" r="20" fill="#5eead4"/><text x="2448" y="1020" class="num">4</text>
  <text x="2490" y="1013" class="legend">Transmission motorisée</text>
  <text x="2490" y="1049" class="small">Servomoteur et synchronisation G / D</text>

  <circle cx="2448" cy="1230" r="20" fill="#5eead4"/><text x="2448" y="1230" class="num">5</text>
  <text x="2490" y="1223" class="legend">Châssis circulaire</text>
  <text x="2490" y="1259" class="small">Support et guidage des éléments</text>

  <rect x="2410" y="1455" width="470" height="178" rx="22" fill="#101a26" stroke="#26364a" stroke-width="3"/>
  <text x="2445" y="1510" class="legend-title">CODE COULEUR</text>
  <circle cx="2450" cy="1563" r="13" fill="#d39b31"/><text x="2480" y="1572" class="small">Pignons</text>
  <circle cx="2630" cy="1563" r="13" fill="#46b9b2"/><text x="2660" y="1572" class="small">Crémaillères</text>
  <circle cx="2450" cy="1608" r="13" fill="#3f638c"/><text x="2480" y="1617" class="small">Structure</text>
  <circle cx="2630" cy="1608" r="13" fill="#b84f45"/><text x="2660" y="1617" class="small">Support ressort</text>

  <text x="92" y="1750" class="small">Vue issue du modèle Fusion • couleurs fonctionnelles • schéma de compréhension, non coté</text>
</svg>
